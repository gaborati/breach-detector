version: "3.8"

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: breach-detector-app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - .:/var/www
        networks:
            - breach-network

    webserver:
        image: nginx:alpine
        container_name: breach-detector-nginx
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - .:/var/www
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
        networks:
            - breach-network

    db:
        image: mysql:8.0
        container_name: breach-detector-db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_ROOT_HOST: "%"
        networks:
            - breach-network

networks:
    breach-network:
        driver: bridge
